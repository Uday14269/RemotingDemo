# Updated build.yml to fix gitleaks-action error and enhance security scan
name: Build and Security Scan
on:
  push:
    branches:
      - main
      - fix_security_issues
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Tests
        run: |
          pytest
      # Enhanced security scan step using maintained gitleaks action
      - name: Run Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v2.2.0
        with:
          args: --no-git --source .
