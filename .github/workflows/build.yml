# Fixed build pipeline YAML
name: Build and Security Scan
on:
  push:
    branches: [ main, fix_security_issues ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'adopt'
      - name: Ensure gradlew exists
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found. Attempting to generate wrapper."
            gradle wrapper || { echo "gradle wrapper generation failed"; exit 1; }
          fi
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build with Gradle
        run: ./gradlew build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          JAVA_HOME_11_X64: ${{ env.JAVA_HOME_11_X64 }}
      - name: Security Scan
        uses: github/codeql-action/init@v2
        with:
          languages: java
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
