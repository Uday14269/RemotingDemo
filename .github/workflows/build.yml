# Sample GitHub Actions workflow with enhanced security checks
name: Build and Test

on:
  push:
    branches:
      - fix_security_issues
  pull_request:
    branches:
      - Testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Validate YAML syntax
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows/build.yml

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.11.0
        with:
          scan-type: fs
          scan-ref: .

      - name: Run npm audit (if Node.js project)
        run: |
          if [ -f package.json ]; then
            npm install
            npm audit --audit-level=high || true
          fi

      - name: Run Bandit security scan (if Python project)
        run: |
          if [ -f requirements.txt ]; then
            pip install bandit
            bandit -r . || true
          fi

      - name: Build
        run: echo "Building the project..."

      - name: Run tests
        run: echo "Running tests..."

      - name: Validate code formatting
        run: |
          if [ -f pyproject.toml ]; then
            pip install black
            black --check .
          fi

      - name: Check for secrets in code
        uses: gitleaks/gitleaks-action@v2.2.0
        with:
          fail: true
