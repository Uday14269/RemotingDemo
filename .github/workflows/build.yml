# Fixed build.yml
# - Replaces missing gitleaks action with official gitleaks/gitleaks-action
# - Adds security scan step after tests
# - Ensures compatibility with runner version 2.331.0

name: Build and Security Scan

on:
  push:
    branches:
      - main
      - fix_security_issues
  pull_request:
    branches:
      - main
      - fix_security_issues

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest
      - name: Security Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --path=. --no-git --verbose
