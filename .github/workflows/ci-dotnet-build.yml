# .github/workflows/ci-dotnet-build.yml
# Enhanced security: Added additional security steps as per user instruction
name: .NET Build & Test with Security

on:
  push:
    branches: [ main, fix_security_issues ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-restore --verbosity normal

      # --- Added Security Steps Below ---
      - name: Run .NET Security Analysis (dotnet security)
        run: |
          dotnet tool install --global security-scan
          export PATH="$PATH:/home/runner/.dotnet/tools"
          security-scan --project .

      - name: Run Trivy Vulnerability Scanner on Source
        uses: aquasecurity/trivy-action@v0.13.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'

      - name: Check for Secrets in Codebase
        uses: trufflesecurity/trufflehog@main
        with:
          path: .

      - name: Check Dependency Vulnerabilities (OSS Index)
        uses: sonatype-nexus-community/ossindex-github-action@v1
        with:
          files: '**/*.csproj'

      # --- End Security Steps ---
