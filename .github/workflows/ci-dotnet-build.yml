# ci-dotnet-build.yml
# [UPDATED] Fixed test job failure and added security scan step after tests

name: .NET Core CI

on:
  push:
    branches: [ main, fix_security_issues ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: '**/TestResults/*.trx'
      # --- Security scan step added below ---
      - name: Run dotnet security scan
        run: |
          dotnet tool install --global dotnet-security-audit || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet security-audit --no-cache
