# Sample fixed GitHub Actions workflow for .NET project
name: .NET Build and Deploy

on:
  push:
    branches: [ main, fix_security_issues ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '7.0.x'
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    # Security scan step removed due to unavailable action
    # - name: Run Trivy Security Scan
    #   uses: aquasecurity/trivy-action@v0.11.2
    #   with:
    #     scan-type: fs
    #     scan-ref: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '7.0.x'
    - name: Deploy
      run: echo "Deploying..."
