# Fix for security scan action error
# Replace invalid zricethez/gitleaks-action with official gitleaks action

name: CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Tests
        run: |
          pytest
      - name: Security Scan
        # FIX: Replacing zricethez/gitleaks-action with official gitleaks action
        uses: gitleaks/gitleaks-action@v2.2.0
        with:
          args: "detect --source ."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
# ...rest of workflow steps
