# Updated GitHub Actions workflow
name: CI
on:
  push:
    branches: [ main, fix_security_issues ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: ./gradlew build
      - name: Run tests
        run: ./gradlew test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: build/test-results
      - name: Security Scan
        run: |
          curl -sSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
          ./trivy fs . --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
      - name: Upload Security Scan Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: trivy-report.json