# Fixed GitHub Actions workflow YAML for Maven build with SonarQube and security scan
name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'adopt'
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Install SonarQube Maven Plugin
        run: mvn org.sonarsource.scanner.maven:sonar-maven-plugin:3.9.1.2184:help
      - name: Build with Maven
        run: mvn clean install
      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn org.sonarsource.scanner.maven:sonar-maven-plugin:3.9.1.2184:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${SONAR_TOKEN}
      - name: Security Scan with OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@v3.0.3
        with:
          project: 'RemotingDemo'
          path: '.'
          format: 'HTML'
          out: 'dependency-check-report.html'
      - name: Upload security scan report
        uses: actions/upload-artifact@v3
        with:
          name: dependency-check-report
          path: dependency-check-report.html
