name: CI
on:
  push:
    branches:
      - master
      - fix_security_issues
  pull_request:
    branches:
      - master
      - fix_security_issues
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest
      - name: Security Scan
        run: |
          pip install bandit
          bandit -r .
